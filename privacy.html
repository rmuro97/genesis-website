<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy · Genesis AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #080d1a;
      --gold: #c8a96e;
      --gold-light: #e2c98a;
      --white: #ffffff;
      --text-muted: #7a8fa8;
      --border: rgba(200, 169, 110, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--navy);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 24px 60px;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      object-fit: contain;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: var(--white);
      letter-spacing: 3px;
    }
    .logo-text span { color: var(--gold); }
    .page-label {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .back {
      margin-top: 48px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back:hover { color: var(--gold); border-color: var(--gold); }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img class="logo-img" src="/genesis-logo-new.png" alt="Genesis AI" />
    <div class="page-label">Privacy Policy</div>
  </div>
  <a href="/" class="back">← Back to Site</a>
</body>
</html>
